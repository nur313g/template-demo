# GANTI repo di bawah dengan "usernameGitHub/nama-repo-klien"
backend:
  name: github
  repo: USERNAME-GITHUB/NAMA-REPO-BARU
  branch: main

locale: id
media_folder: public/images
public_folder: /images
site_url: https://GANTI-DENGAN-ALAMAT-SITUS.pages.dev

collections:
  - name: situs
    label: Website
    files:
      - name: site
        label: Isi Website
        file: src/data/site.json
        format: json
        fields:
          - label: Tema Warna
            name: theme
            widget: select
            options: [ocean, sunset, forest, rose, violet, teal, slate, amber, crimson, navy]
            default: ocean
          - label: Gaya (font, bentuk tombol, kerapatan)
            name: style
            widget: select
            options: [clean, bold, soft, elegant, compact]
            default: clean
            required: false
          - label: Susunan tampilan
            name: layout
            widget: object
            required: false
            fields:
              - { label: Bagian atas (hero), name: hero, widget: select, options: [split, center, full], default: split, required: false }
              - { label: Layanan, name: services, widget: select, options: [cards, list, icons], default: cards, required: false }
              - { label: Galeri, name: gallery, widget: select, options: [grid, masonry], default: grid, required: false }
              - { label: Menu atas, name: header, widget: select, options: [left, center], default: left, required: false }
          - label: SEO (judul & deskripsi Google)
            name: meta
            widget: object
            fields:
              - { label: Judul halaman (maks 60 huruf), name: title, widget: string }
              - { label: Deskripsi (maks 155 huruf), name: description, widget: text }
              - { label: Alamat website (URL), name: url, widget: string }
              - { label: Gambar share (OG), name: ogImage, widget: string, required: false }
              - { label: Bahasa, name: lang, widget: hidden, default: id }
          - label: Data Usaha
            name: business
            widget: object
            fields:
              - { label: Nama usaha, name: name, widget: string }
              - { label: Slogan, name: tagline, widget: string, required: false }
              - { label: Logo (nama file di folder images), name: logo, widget: string, required: false }
              - { label: Logo sudah memuat nama usaha (sembunyikan teks nama di header), name: logoHasName, widget: boolean, default: false, required: false }
              - { label: Telepon, name: phone, widget: string }
              - { label: WhatsApp (08xxx), name: whatsapp, widget: string }
              - { label: Pesan awal WhatsApp, name: waMessage, widget: string, required: false }
              - { label: Email, name: email, widget: string, required: false }
              - { label: Alamat, name: address, widget: string }
              - { label: Kota, name: city, widget: string }
              - { label: Provinsi, name: region, widget: string, required: false }
              - { label: Kisaran harga (Rp / RpRp / RpRpRp), name: priceRange, widget: string, required: false }
              - { label: Jenis usaha (schema.org), name: schemaType, widget: string, default: LocalBusiness }
              - label: Koordinat
                name: geo
                widget: object
                required: false
                fields:
                  - { label: Latitude, name: lat, widget: string, required: false }
                  - { label: Longitude, name: lng, widget: string, required: false }
              - label: Jam buka
                name: hours
                widget: list
                required: false
                fields:
                  - { label: Hari, name: day, widget: string }
                  - { label: Jam, name: time, widget: string }
          - label: Statistik & Verifikasi Google
            name: analytics
            widget: object
            required: false
            fields:
              - { label: ID Google Analytics (G-XXXX), name: ga4Id, widget: string, required: false }
              - { label: Kode verifikasi Search Console, name: searchConsoleVerification, widget: string, required: false }
          - label: Media Sosial (isi link lengkap)
            name: social
            widget: object
            required: false
            fields:
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: Facebook, name: facebook, widget: string, required: false }
              - { label: TikTok, name: tiktok, widget: string, required: false }
              - { label: YouTube, name: youtube, widget: string, required: false }
          - { label: Catatan footer, name: footerNote, widget: string, required: false }
          - label: Bagian Halaman (susun urutan seperti lego)
            name: sections
            widget: list
            typeKey: type
            types:
              - label: Hero (header utama)
                name: hero
                widget: object
                fields:
                  - { label: Tampilkan, name: enabled, widget: boolean, default: true }
                  - { label: Judul besar, name: title, widget: string }
                  - { label: Sub judul, name: subtitle, widget: text }
                  - { label: Label kecil (badge), name: badge, widget: string, required: false }
                  - { label: Teks tombol utama, name: ctaLabel, widget: string, required: false }
                  - { label: Teks tombol kedua, name: secondaryLabel, widget: string, required: false }
                  - { label: Tujuan tombol kedua (#pricing dll), name: secondaryHref, widget: string, required: false }
                  - { label: Gambar, name: image, widget: image, required: false }
                  - { label: Deskripsi gambar, name: imageAlt, widget: string, required: false }
              - label: Tentang
                name: about
                widget: object
                fields:
                  - { label: Tampilkan, name: enabled, widget: boolean, default: true }
                  - { label: Label menu, name: navLabel, widget: string, required: false }
                  - { label: Judul, name: title, widget: string }
                  - { label: Isi teks, name: text, widget: text }
                  - { label: Gambar, name: image, widget: image, required: false }
                  - { label: Poin keunggulan, name: points, widget: list, required: false, field: { label: Poin, name: text, widget: string } }
              - label: Layanan
                name: services
                widget: object
                fields:
                  - { label: Tampilkan, name: enabled, widget: boolean, default: true }
                  - { label: Label menu, name: navLabel, widget: string, required: false }
                  - { label: Judul, name: title, widget: string }
                  - { label: Sub judul, name: subtitle, widget: string, required: false }
                  - label: Daftar layanan
                    name: items
                    widget: list
                    fields:
                      - { label: Ikon (emoji), name: icon, widget: string, required: false }
                      - { label: Nama layanan, name: title, widget: string }
                      - { label: Deskripsi, name: description, widget: text }
                      - { label: Harga (opsional), name: price, widget: string, required: false }
              - label: Tarif / Paket Harga
                name: pricing
                widget: object
                fields:
                  - { label: Tampilkan, name: enabled, widget: boolean, default: true }
                  - { label: Label menu, name: navLabel, widget: string, required: false }
                  - { label: Judul, name: title, widget: string }
                  - { label: Sub judul, name: subtitle, widget: string, required: false }
                  - { label: Catatan bawah, name: note, widget: string, required: false }
                  - label: Daftar paket
                    name: items
                    widget: list
                    fields:
                      - { label: Nama paket, name: name, widget: string }
                      - { label: Harga (tulis lengkap, mis. Rp 7.000), name: price, widget: string }
                      - { label: Satuan (kg, pcs, bulan), name: unit, widget: string, required: false }
                      - { label: Deskripsi singkat, name: description, widget: string, required: false }
                      - { label: Sorot sebagai terlaris, name: highlight, widget: boolean, default: false }
                      - { label: Fitur, name: features, widget: list, required: false, field: { label: Fitur, name: text, widget: string } }
              - label: Galeri Foto
                name: gallery
                widget: object
                fields:
                  - { label: Tampilkan, name: enabled, widget: boolean, default: true }
                  - { label: Label menu, name: navLabel, widget: string, required: false }
                  - { label: Judul, name: title, widget: string }
                  - label: Foto
                    name: images
                    widget: list
                    required: false
                    fields:
                      - { label: Foto, name: src, widget: image }
                      - { label: Deskripsi foto (untuk SEO), name: alt, widget: string }
                      - { label: Keterangan, name: caption, widget: string, required: false }
              - label: Video YouTube
                name: video
                widget: object
                fields:
                  - { label: Tampilkan, name: enabled, widget: boolean, default: true }
                  - { label: Label menu, name: navLabel, widget: string, required: false }
                  - { label: Judul, name: title, widget: string }
                  - { label: Link atau ID YouTube, name: youtube, widget: string }
              - label: Testimoni
                name: testimonials
                widget: object
                fields:
                  - { label: Tampilkan, name: enabled, widget: boolean, default: true }
                  - { label: Judul, name: title, widget: string }
                  - label: Testimoni
                    name: items
                    widget: list
                    fields:
                      - { label: Nama, name: name, widget: string }
                      - { label: Keterangan (profesi/kota), name: role, widget: string, required: false }
                      - { label: Isi testimoni, name: text, widget: text }
                      - { label: Bintang (1-5), name: rating, widget: number, default: 5, min: 1, max: 5 }
              - label: FAQ
                name: faq
                widget: object
                fields:
                  - { label: Tampilkan, name: enabled, widget: boolean, default: true }
                  - { label: Label menu, name: navLabel, widget: string, required: false }
                  - { label: Judul, name: title, widget: string }
                  - label: Pertanyaan
                    name: items
                    widget: list
                    fields:
                      - { label: Pertanyaan, name: q, widget: string }
                      - { label: Jawaban, name: a, widget: text }
              - label: Peta Google Maps
                name: map
                widget: object
                fields:
                  - { label: Tampilkan, name: enabled, widget: boolean, default: true }
                  - { label: Label menu, name: navLabel, widget: string, required: false }
                  - { label: Judul, name: title, widget: string }
                  - { label: Link embed (isi src dari Maps > Bagikan > Sematkan), name: embedUrl, widget: string, required: false }
              - label: Kontak
                name: contact
                widget: object
                fields:
                  - { label: Tampilkan, name: enabled, widget: boolean, default: true }
                  - { label: Label menu, name: navLabel, widget: string, required: false }
                  - { label: Judul, name: title, widget: string }
                  - { label: Sub judul, name: subtitle, widget: string, required: false }
              - label: Media Sosial
                name: social
                widget: object
                fields:
                  - { label: Tampilkan, name: enabled, widget: boolean, default: true }
                  - { label: Judul, name: title, widget: string, required: false }
              - label: Ajakan Bertindak (CTA)
                name: cta
                widget: object
                fields:
                  - { label: Tampilkan, name: enabled, widget: boolean, default: true }
                  - { label: Judul, name: title, widget: string }
                  - { label: Teks, name: text, widget: string, required: false }
                  - { label: Teks tombol, name: buttonLabel, widget: string, required: false }
                  - { label: Link tombol (kosong = WhatsApp), name: buttonHref, widget: string, required: false }
